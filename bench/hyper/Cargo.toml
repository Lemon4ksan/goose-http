[package]
name = "bench-hyper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "=1.53.2", features = ["rt", "rt-multi-thread", "net", "time"] }

# TechEmpower's profile for hyper, with panic = "abort" as for may-minihttp.
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
