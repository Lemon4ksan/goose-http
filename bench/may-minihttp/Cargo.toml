[package]
name = "bench-may-minihttp"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
may = { version = "=0.3.51", default-features = false }
may_minihttp = { version = "=0.1.11", default-features = false }
mimalloc = { version = "0.1", default-features = false }
yarte = { version = "0.15", features = ["bytes-buf", "json"] }
# Lets yarte serialize into the response's BytesMut.
buf-min = { version = "0.7", features = ["bytes"] }

# TechEmpower's profile for may-minihttp.
[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
lto = "thin"
debug = false
incremental = false
overflow-checks = false
